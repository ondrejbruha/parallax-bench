name: release
on:
  release:
    types: [published]
  # manual re-publish of an existing tag (e.g. the release event got lost):
  #   gh workflow run release.yml --ref v0.1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: refuse manual runs that are not on a tag
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error::hatch-vcs derives the version from the tag — a run on a branch would publish a dev version. Use: gh workflow run release.yml --ref vX.Y.Z"
          exit 1
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # hatch-vcs needs tags
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pipx run build
      - run: pipx run twine check dist/*
      - name: verify bundled data made it into the wheel
        run: python -m zipfile -l dist/parallax_bench-*.whl | grep -q "_data/smoke/queries.jsonl"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write               # OIDC — the whole trick
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
