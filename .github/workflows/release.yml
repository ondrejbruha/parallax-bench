name: release
on:
  push:
    tags: ["v*"]
  # a release created by hand in the GitHub UI on an already-pushed tag
  # still needs to build & publish:
  release:
    types: [published]
  # manual re-publish of an existing tag (e.g. the release event got lost):
  #   gh workflow run release.yml --ref v0.1.0
  workflow_dispatch:

# a UI-created release on a new tag fires both push and release events —
# serialise the two runs instead of racing on PyPI
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: refuse manual runs that are not on a tag
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error::hatch-vcs derives the version from the tag — a run on a branch would publish a dev version. Use: gh workflow run release.yml --ref vX.Y.Z"
          exit 1
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # hatch-vcs needs tags
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pipx run build
      - run: pipx run twine check dist/*
      - name: verify bundled data made it into the wheel
        run: python -m zipfile -l dist/parallax_bench-*.whl | grep -q "_data/smoke/queries.jsonl"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write               # OIDC — the whole trick
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # the push and release events can both build the same tag —
          # an already-uploaded file is not an error then
          skip-existing: true

  github-release:
    # tag push (or manual dispatch on a tag) creates the GitHub release,
    # which is what fires the Zenodo webhook; skip when the release
    # itself triggered this run
    if: github.event_name != 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: create release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes
